name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Force the workflow to fail early (smoke test gates)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on request (smoke)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fail == 'true' }}
        run: |
          echo "Force-fail is enabled. Exiting 1 to test CI gating."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Next.js (web)
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextcache-web-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**') }}
          restore-keys: |
            ${{ runner.os }}-nextcache-web-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache Next.js (docs)
        uses: actions/cache@v4
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-nextcache-docs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**') }}
          restore-keys: |
            ${{ runner.os }}-nextcache-docs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm -w --if-present lint

      - name: Typecheck
        run: pnpm -w check-types

      - name: Build UI and Icons packages
        run: pnpm -w -F @youngro/ui -F @youngro/icons build

      - name: Build web app
        env:
          NODE_OPTIONS: --trace-uncaught --unhandled-rejections=strict
        run: pnpm turbo run build --filter=web...

      - name: Build docs app
        run: pnpm turbo run build --filter=docs...

      - name: Verify web build output
        run: test -f apps/web/.next/BUILD_ID || (echo "web BUILD_ID missing" && exit 1)

      - name: Verify docs build output
        run: test -f apps/docs/.next/BUILD_ID || (echo "docs BUILD_ID missing" && exit 1)
